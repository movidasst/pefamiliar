const rf=$('#riskForm');if(rf){const redraw=()=>{$$('#thPlans select[name^=tp_]').forEach(x=>{if(x.value)state.threatPlans[x.name.slice(3)]=x.value});$('#thPlans').innerHTML=`<div class="section-title"><div><h2>Respuesta general por amenaza</h2><p>La instrucción oficial siempre prevalece.</p></div></div>${threatPlanFields($$('#ths input:checked').map(x=>x.value))}`;$('#thOther').style.display=$$('#ths input:checked').some(x=>x.value==='otra')?'block':'none'};const toggleOthers=()=>{$('#vulOther').style.display=$$('#vls input:checked').some(x=>x.value==='otro')?'block':'none';$('#capOther').style.display=$$('#cps input:checked').some(x=>x.value==='otro')?'block':'none'};$$('#ths input').forEach(x=>x.onchange=redraw);$$('#vls input, #cps input').forEach(x=>x.onchange=toggleOthers);$('#vulNA').onchange=e=>{if(e.target.checked)$$('#vls input').forEach(x=>x.checked=false);toggleOthers()};$('#capNA').onchange=e=>{if(e.target.checked)$$('#cps input').forEach(x=>x.checked=false);toggleOthers()};rf.onsubmit=saveRisks}

function togglePickupPreview(){const f=$('#memberForm');if(!f)return;const age=f.elements.age.value,places=[f.elements.place.value,...$$('#memberPlaces input:checked').map(x=>x.value)];$('#pickupCard').style.display=['child','teen'].includes(age)&&places.some(p=>/Escuela|colegio|Guardería|Transporte escolar/i.test(p))?'block':'none'}
async function saveMember(e){e.preventDefault();const f=e.currentTarget,m=humans().find(x=>x.id===routeArg),needs=$$('#needs input:checked').map(x=>x.value),plChoice=f.elements.place.value,custom=$('#placeOther')?.value.trim()||'';if(/^Otro/.test(plChoice)&&!custom)return toast('Especifica el otro lugar principal');const place=/^Otro/.test(plChoice)?custom:plChoice,sel=$$('#memberPlaces input:checked').map(x=>x.value),std=sel.filter(x=>!/^Otro/.test(x));if(sel.some(x=>/^Otro/.test(x))&&custom)std.push(custom);std.push(place);let relation=f.elements.relation.value;if(/^Otro/.test(relation)&&$('#relationOther')?.value.trim())relation=$('#relationOther').value.trim();const finalPlaces=[...new Set(std.filter(Boolean))],schoolFlag=['child','teen'].includes(f.elements.age.value)&&finalPlaces.some(p=>/Escuela|colegio|Guardería|Transporte escolar/i.test(p));const d={id:m?.id||uid(),name:f.elements.name.value.trim(),relation,age:f.elements.age.value,place,places:finalPlaces,placeOther:custom,needs,needOther:needs.includes('other')?f.elements.needOther.value.trim():'',pickup:schoolFlag?{primary:f.elements.pickupPrimary?.value||'',backup:f.elements.pickupBackup?.value||'',institution:f.elements.institution?.value.trim()||'',phone:f.elements.institutionPhone?.value.trim()||'',notes:''}:{primary:'',backup:'',institution:'',phone:'',notes:''}};if(m)Object.assign(m,d);else state.members.push(d);await saveState('Integrante guardado',true,'Actualizar integrantes');routeTo('family')}
async function saveRisks(e){e.preventDefault();const f=e.currentTarget;state.threats=$$('#ths input:checked').map(x=>x.value);state.vulns=$$('#vls input:checked').map(x=>x.value);state.caps=$$('#cps input:checked').map(x=>x.value);state.riskReview={vulns:true,caps:true};const fd=new FormData(f);state.custom.threat=state.threats.includes('otra')?String(fd.get('threatOther')||'').trim():'';state.custom.vuln=state.vulns.includes('otro')?String(fd.get('vulnOther')||'').trim():'';state.custom.cap=state.caps.includes('otro')?String(fd.get('capOther')||'').trim():'';const np={};state.threats.forEach(t=>{const v=fd.get(`tp_${t}`);if(v)np[t]=v});state.threatPlans=np;await saveState('Contexto guardado',true,'Identificar riesgos');routeTo('reunion')}
async function saveReunion(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f);state.reunion.outsideZone=fd.get('outsideZone').trim();state.reunion.pointA=fd.get('pointA').trim();state.reunion.pointBNA=fd.get('pointBMode')==='na';state.reunion.pointB=state.reunion.pointBNA?'':fd.get('pointB').trim();state.reunion.pointRule=fd.get('pointRule').trim();for(const m of humans()){const byPlace={};memberPlaces(m).forEach((p,i)=>byPlace[p]={mode:String(fd.get(`sep_${m.id}_${i}`)||''),other:String(fd.get(`sepOther_${m.id}_${i}`)||'').trim()});const first=byPlace[m.place]||Object.values(byPlace)[0]||{mode:'',other:''};state.separated[m.id]={...first,byPlace}}await saveState('Acuerdos guardados',true,'Acordar reunificación');routeTo('roles')}
async function saveRoles(e){e.preventDefault();const f=new FormData(e.currentTarget);state.roles.coord=f.get('coord');state.roles.comm=f.get('comm');state.roles.kit=f.get('kit');state.roles.utilities=f.get('utilities');state.roles.pets=hasPets()?f.get('pets'):'NA';for(const m of humans().filter(x=>(x.needs||[]).length)){const mode=f.get(`mode_${m.id}`);state.support[m.id]={mode,primary:mode==='self'?'NA':f.get(`primary_${m.id}`),backup:mode==='self'?'NA':f.get(`backup_${m.id}`)}}await saveState('Roles guardados',true,'Asignar roles y apoyos');routeTo('communication')}
async function saveCommunication(e){e.preventDefault();const f=new FormData(e.currentTarget);state.communication.primary=String(f.get('primary')||'');state.communication.alt=String(f.get('alt')||'');state.communication.noComm=String(f.get('noComm')||'');state.communication.noCommOther=String(f.get('noCommOther')||'').trim();state.communication.externalName=String(f.get('externalName')||'').trim();state.communication.externalPhone=String(f.get('externalPhone')||'').trim();state.communication.externalOutside=!!f.get('externalOutside');await saveState('Comunicación guardada',true,'Definir comunicación');routeTo('plan')}
async function saveHome(e){e.preventDefault();const f=new FormData(e.currentTarget);state.home.exits=String(f.get('exits')||'').trim();state.home.safeArea=String(f.get('safeArea')||'').trim();state.home.shutoffGas=String(f.get('gas')||'').trim();state.home.shutoffPower=String(f.get('power')||'').trim();state.home.shutoffWater=String(f.get('water')||'').trim();state.home.notes=String(f.get('notes')||'').trim();await saveState('Vivienda guardada',true,'Actualizar vivienda');routeTo('bag')}

async function saveDrill(e){e.preventDefault();const f=new FormData(e.currentTarget);state.drills.push({id:uid(),date:new Date().toISOString(),scenario:f.get('scenario'),result:f.get('result'),learning:f.get('learning'),improvement:String(f.get('improvement')||'').trim()});state.lastReview=new Date().toISOString();$('#overlay').innerHTML='';await saveState('Práctica guardada',true,'Registrar práctica');safeRender()}
async function handleAction(a,e,b){if(a==='saveFamilyMeta'){state.family=$('#familyName').value.trim();state.city=$('#familyCity').value.trim();state.country=$('#country').value;state.countryOther=$('#countryOther')?.value.trim()||'';await saveState('Datos generales guardados',true,'Actualizar datos generales');safeRender()}else if(a==='addPet')addPetOverlay();else if(a==='newDrill')drillOverlay();else if(a==='closeOverlay'){$('#overlay').innerHTML=''}else if(a==='closeQuick')routeTo('home');else if(a==='runSimulation'){const t=$('#simThreat').value,p=$('#simProfile').value,n=$('#simNoData').checked,res=simulationResult(t,p,n);$('#simResult').innerHTML=res.html;state.simulations.push({id:uid(),date:new Date().toISOString(),scenario:t,profile:p,gaps:res.gaps.length});await saveState('',false);bind()}else if(a==='export')exportPlan();else if(a==='import')$('#importer').click();else if(a==='reset'){if(confirm('¿Borrar el plan guardado en este dispositivo? Esta acción no se puede deshacer salvo que tengas un respaldo.')){state=blank();localStorage.removeItem(KEY);await idbPut('state',state,'current');await saveState('Plan reiniciado');routeTo('home')}}}

function exportPlan(){const data=JSON.stringify({type:'PEF-La-Movida',exported:new Date().toISOString(),version:VERSION,state},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`plan-familiar-${(state.family||'familia').toLowerCase().replace(/[^a-z0-9]+/gi,'-')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importer').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>2_000_000){toast('El archivo es demasiado grande');e.target.value='';return}const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result),candidate=o.state||o;if(!candidate||typeof candidate!=='object'||!Array.isArray(candidate.members))throw 0;state=migrate(candidate);await saveState('Respaldo importado',true,'Importar respaldo');routeTo('home')}catch{toast('El respaldo no tiene un formato válido')}e.target.value=''};r.readAsText(f)}
function printPlan(mode='full'){const bs=bagStats(),flows=state.threats.map(flowPrint).join(''),memberTable=humans().map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.relation)}</td><td>${esc(m.place)}</td><td>${esc(extraPlaces(m).join(', ')||'—')}</td><td>${esc((m.needs||[]).map(n=>label('necesidades_apoyo',n)).join(', ')||'No aplica')}</td></tr>`).join(''),quick=`<section class="quick-page"><div class="brand-print"><strong>La Movida SST Plus · Plan rápido</strong><span>De la Reacción a la Prevención</span></div><h1>Flujos de acción por escenario</h1><p>Reconocer → protegerse → ejecutar el acuerdo → reunirse → comunicar. Las instrucciones oficiales prevalecen.</p>${flows}<h2>Qué hace cada integrante si estamos separados</h2>${humans().map(m=>`<h3>${esc(m.name)}</h3><ul>${memberPlaces(m).map(p=>`<li><strong>${esc(p)}:</strong> ${esc(sepText(m,p))}</li>`).join('')}</ul>`).join('')}</section>`,cards=`<section class="wallet-page"><div class="brand-print"><strong>Tarjetas individuales</strong><span>La Movida SST Plus</span></div><div class="wallet-grid">${humans().map(walletCard).join('')}</div></section>`;let content='';if(mode==='full')content=`<div class="brand-print"><strong>La Movida SST Plus · Plan Familiar de Emergencia</strong><span>www.movidasst.com</span></div><h1>${state.family?'Familia '+esc(state.family):'Plan Familiar de Emergencia'}</h1><p><strong>Localidad:</strong> ${esc(state.city||'—')} · <strong>País:</strong> ${esc(countryInfo().name)}</p><h2>Integrantes</h2><table><tr><th>Nombre</th><th>Relación</th><th>Principal</th><th>Otros lugares</th><th>Apoyos</th></tr>${memberTable}</table><h2>Amenazas</h2><p>${esc(state.threats.map(t=>label('amenazas',t)).join(' · ')||'Pendiente')}</p><h2>Vulnerabilidades</h2><p>${esc(state.vulns.map(v=>label('vulnerabilidades',v)).join(' · ')||'No identificadas / pendiente de revisión')}</p><h2>Capacidades</h2><p>${esc(state.caps.map(c=>label('capacidades',c)).join(' · ')||'No identificadas / pendiente de revisión')}</p><h2>R function flowPrint(id){const f=FLOW[id]||FLOW.otra,name=id==='otra'&&state.custom.threat?state.custom.threat:label('amenazas',id),act=THREAT_ACTIONS.find(x=>x[0]===state.threatPlans[id])?.[1]||'Seguir acuerdo familiar';const steps=[['1 · Reconoce',f.signal],['2 · Protégete',f.protect],['3 · Actúa',act],['4 · Reúnete',`A: ${state.reunion.pointA||'Pendiente'} · B: ${state.reunion.pointBNA?'No aplica':state.reunion.pointB||'Pendiente'}`],['5 · Comunica',noCommText()]];return`<div class="flow-card"><h3>${esc(name)}</h3><div class="flow-grid">${steps.map(([a,b])=>`<div class="flow-step"><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div></div>`}
