<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#007b85">
  <meta name="description" content="Construye, revisa y practica tu Plan Familiar de Emergencia con La Movida SST Plus.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://pefamiliar.movidasst.com/">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <title>Plan Familiar de Emergencia | La Movida SST Plus</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#00205b}.loader{text-align:center;padding:28px;max-width:520px}.spinner{width:48px;height:48px;border:4px solid #dbe5ea;border-top-color:#007b85;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}.loader strong{display:block;font-size:1.05rem}.loader p{margin:8px 0 0;color:#64748b;line-height:1.5;font-size:.9rem}.error{max-width:620px;padding:32px}.error h1{margin-top:0}.retry{margin-top:16px;border:0;border-radius:14px;background:#007b85;color:#fff;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Cargando Plan Familiar de Emergencia…</strong>
    <p>La información se procesa y guarda en este dispositivo.</p>
  </div>
  <script>
  (async()=>{
    const rawBase='https://raw.githubusercontent.com/movidasst/pefamiliar/main/payload/';
    async function loadPart(n){
      const local=`payload/${n}.txt?v=211`;
      try{
        const r=await fetch(local,{cache:'no-store'});
        if(r.ok)return await r.text();
      }catch(_){/* usa respaldo */}
      const rr=await fetch(`${rawBase}${n}.txt`,{cache:'no-store',mode:'cors'});
      if(!rr.ok)throw new Error(`No se pudo cargar el componente ${n} de la aplicación.`);
      return rr.text();
    }
    try{
      if(!('DecompressionStream' in window)) throw new Error('Tu navegador necesita una versión más reciente para abrir esta aplicación.');
      const parts=await Promise.all([1,2,3,4,5,6].map(loadPart));
      const b64=parts.join('').replace(/\s+/g,'');
      const bin=atob(b64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(e){
      console.error('PEF load error',e);
      document.body.innerHTML=`<main class="error"><h1>No se pudo abrir la aplicación</h1><p style="color:#475569;line-height:1.55">${String(e.message||e)}</p><p style="color:#475569;line-height:1.55">Comprueba tu conexión y vuelve a intentarlo.</p><button class="retry" onclick="location.reload()">Volver a intentar</button></main>`;
    }
  })();
  </script>
</body>
</html>
