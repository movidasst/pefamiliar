<section class="section next"><span>Siguiente paso</span><b>${esc(p.next.name)}</b><p style="margin:5px 0 0;color:var(--muted);font-size:.82rem">${esc(p.next.desc)}</p><div class="progress"><i style="width:${p.pct}%"></i></div><small>${p.done}/${p.total} componentes · ${p.pct}% completado</small><div class="actions"><button class="btn primary small" data-act="${p.next.act}">Resolver ahora</button><button class="btn soft small" data-go="plan">Ver ruta</button></div></section>
<section class="section metrics"><div class="metric"><strong>${humans().length}</strong><span>personas</span></div><div class="metric"><strong>${allNeeds().length}</strong><span>tipos de apoyo</span></div><div class="metric"><strong>${hasPets()?s.pets.length:0}</strong><span>mascotas</span></div><div class="metric"><strong>${s.drills.length}</strong><span>simulacros</span></div></section>
<section class="section"><div class="title"><div><h2>Prioridades</h2><p>Solo se muestran pendientes que realmente aplican.</p></div></div><div class="list">${rs.slice(0,4).map(ruleHTML).join('')}</div></section>`}
function family(){return`<div class="title"><div><h2>1. Mi familia</h2><p>Este paso alimenta Roles, Apoyos, Comunicación y Kit.</p></div></div><section class="card"><div class="row"><div class="field"><label>Nombre o apellido familiar</label><input id="familyName" value="${esc(s.family)}" placeholder="Ej. Linares"></div><div class="field"><label>Ciudad / localidad</label><input id="familyCity" value="${esc(s.city)}" placeholder="Ej. Santiago"></div></div><button class="btn primary" data-act="save-meta">Guardar datos</button></section>
<section class="section"><div class="title"><div><h2>Integrantes</h2><p>Selecciona necesidades; escribe solo lo excepcional.</p></div><button class="btn soft small" data-act="add-member">＋ Persona</button></div><div class="list">${humans().length?humans().map(memberCard).join(''):'<div class="empty">Aún no hay integrantes.</div>'}</div></section>
<section class="section"><div class="title"><div><h2>Mascotas</h2><p>Si no tienes mascotas, queda automáticamente como <strong>No aplica</strong>.</p></div><button class="btn soft small" data-act="add-pet">＋ Mascota</button></div>${hasPets()?`<div class="list">${s.pets.map(p=>`<div class="item"><div class="itemtop"><div><strong>${esc(p.name)}</strong><p>${esc(p.type||'Mascota')}</p></div><button class="btn danger small" data-del-pet="${p.id}">Eliminar</button></div></div>`).join('')}</div>`:'<div class="na">No aplica · No hay mascotas registradas.</div>'}</section>`}
function memberCard(m){const tags=(m.needs||[]).map(n=>`<span class="tag ${n==='meds'?'warn':''}">${esc(label(NEEDS,n))}</span>`).join('');return`<div class="item"><div class="itemtop"><div><strong>${esc(m.name)}</strong><p>${esc(m.relation||'Relación pendiente')} · ${esc(m.place||'Lugar habitual pendiente')}</p>${tags||'<span class="tag mutedtag">Sin necesidades especiales registradas</span>'}</div><div><button class="btn soft small" data-edit-member="${m.id}">Editar</button> <button class="btn danger small" data-del-member="${m.id}">×</button></div></div></div>`}
function plan(){const p=progress();return`<div class="title"><div><h2>Mi plan progresivo</h2><p>Completa en orden; cada paso reutiliza lo anterior.</p></div></div><section class="next"><span>Ahora</span><b>${esc(p.next.name)}</b><p style="margin:5px 0;color:var(--muted);font-size:.82rem">${esc(p.next.desc)}</p><button class="btn primary small" data-act="${p.next.act}">Abrir siguiente paso</button></section><section class="section grid">${p.c.map((x,i)=>`<div class="step ${x.ok?'done':''} ${x.key===p.next.key?'current':''}"><span class="num">${x.ok?'✓':i+1}</span><div class="copy"><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></div><button class="btn soft small" data-act="${x.act}">${x.ok?'Revisar':'Abrir'}</button></div>`).join('')}</section><section class="section"><div class="title"><div><h2>Revisión automática</h2><p>No penaliza elementos que no aplican.</p></div></div><div class="list">${rules().map(ruleHTML).join('')}</div></section>`}
function ruleHTML(r){return`<div class="item rule ${r[0]==='red'?'redline':r[0]==='warn'?'warnline':'okline'}"><strong>${esc(r[1])}</strong><p>${esc(r[2])}</p></div>`}
function drill(){return`<div class="title"><div><h2>Practicar el plan</h2><p>Comprueba decisiones, no velocidad.</p></div></div><section class="grid two">${['Sismo con familia separada','Incendio nocturno','Evacuación del sector','Corte prolongado de servicios'].map(x=>`<div class="card"><h3 style="margin:0;color:var(--navy)">${x}</h3><p style="color:var(--muted);font-size:.82rem">Ejecuta el acuerdo existente y registra qué debe mejorar.</p><button class="btn soft small" data-scenario="${x}">Registrar práctica</button></div>`).join('')}</section><section class="section"><div class="title"><div><h2>Historial</h2><p>${s.drills.length} práctica(s) registrada(s).</p></div></div><div class="list">${s.drills.length?s.drills.slice().reverse().map(d=>`<div class="item"><strong>${esc(d.scenario)}</strong><p>${new Date(d.date).toLocaleString('es')} · ${esc(d.result)}${d.improvement?' · Mejora: '+esc(d.improvement):''}</p></div>`).join(''):'<div class="empty">Aún no hay prácticas registradas.</div>'}</div></section>`}
function more(){const b=bagStats();return`<div class="title"><div><h2>Más herramientas</h2><p>Respaldo, PDF y resumen del estado.</p></div></div><section class="card"><div class="kv"><span>Plan completado</span><strong>${progress().pct}%</strong></div><div class="kv"><span>Kit listo</span><strong>${b.ready}/${b.required}</strong></div><div class="kv"><span>Última actualización</span><strong>${new Date(s.updated).toLocaleDateString('es')}</strong></div><div class="actions"><button class="btn soft" data-act="print">Generar PDF</button><button class="btn soft" data-act="export">Exportar respaldo</button><button class="btn soft" data-act="import">Importar</button><button class="btn danger" data-act="reset">Borrar plan</button></div></section>`}
function bind(){$$('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;scrollTo(0,0);render()});$$('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$$('[data-edit-member]').forEach(b=>b.onclick=()=>openMember(b.dataset.editMember));$$('[data-del-member]').forEach(b=>b.onclick=()=>delMember(b.dataset.delMember));$$('[data-del-pet]').forEach(b=>b.onclick=()=>{s.pets=s.pets.filter(p=>p.id!==b.dataset.delPet);if(!hasPets())s.roles.pets='NA';save();render()});$$('[data-scenario]').forEach(b=>b.onclick=()=>openDrill(b.dataset.scenario))}
function act(a){if(a==='continue')return act(progress().next.act);if(a==='family'){view='family';render();return}if(a==='drill'){view='drill';render();return}if(a==='risks')return openRisks();if(a==='reunion')return openReunion();if(a==='roles')return openRoles();if(a==='communication')return openCommunication();if(a==='bag')return openBag();if(a==='add-member')return openMember();if(a==='add-pet')return openPet();if(a==='save-meta'){s.family=$('#familyName').value.trim();s.city=$('#familyCity').value.trim();save();render();return}if(a==='share')return share();if(a==='emergency')return emergency();if(a==='print')return printPlan();if(a==='export')return exportPlan();if(a==='import')return $('#importer').click();if(a==='reset'){if(confirm('¿Borrar todo el plan guardado en este dispositivo?')){localStorage.removeItem(KEY);s=blank();render()}return}}
function modal(title,html){$('#dt').textContent=title;$('#db').innerHTML=html;$('#dlg').showModal()}
function close(){if($('#dlg').open)$('#dlg').close()}
$('#dx').onclick=close;
function needsChips(selected=[]){return NEEDS.map(([id,n])=>`<div class="chip"><input type="checkbox" id="need_${id}" value="${id}" ${selected.includes(id)?'checked':''}><label for="need_${id}">${esc(n)}</label></div>`).join('')}
function openMember(id=''){const m=humans().find(x=>x.id===id)||{id:'',name:'',relation:'',age:'adult',place:'',needs:[],needOther:'',pickup:''};modal(m.id?'Editar integrante':'Agregar integrante',`<form id="mf"><div class="row"><div class="field"><label>Nombre</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Relación</label><select name="relation"><option value="">Seleccionar</option>${['Madre','Padre','Hijo/a','Pareja','Abuelo/a','Hermano/a','Otro'].map(x=>`<option ${m.relation===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Grupo</label><select name="age"><option value="child" ${m.age==='child'?'selected':''}>Niño/a</option><option value="teen" ${m.age==='teen'?'selected':''}>Adolescente</option><option value="adult" ${m.age==='adult'?'selected':''}>Adulto</option><option value="elder" ${m.age==='elder'?'selected':''}>Adulto mayor</option></select></div><div class="field"><label>Lugar habitual</label><select name="place"><option value="">Seleccionar</option>${['Casa','Trabajo','Escuela / guardería','Universidad','Casa de familiar','Otro'].map(x=>`<option ${m.place===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Necesidades o apoyos que aplican</label><small>Selecciona todas las que correspondan. Si ninguna aplica, déjalas sin marcar.</small><div class="chips" id="needs">${needsChips(m.needs)}</div></div><div class="field"><label>Otra necesidad (solo si hace falta)</label><input name="needOther" value="${esc(m.needOther||'')}" placeholder="Opcional"></div><div class="sticky"><button type="button" class="btn ghost" id="cancelM">Cancelar</button><button class="btn primary">Guardar integrante</button></div></form>`);$('#cancelM').onclick=close;$('#mf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),needs=$$('#needs input:checked').map(x=>x.value),d={name:f.get('name').trim(),relation:f.get('relation'),age:f.get('age'),place:f.get('place'),needs,needOther:f.get('needOther').trim()};if(m.id)Object.assign(m,d);else s.members.push({id:uid(),...d});save();close();render()}}
function delMember(id){const m=humans().find(x=>x.id===id);if(confirm(`¿Eliminar a ${m?.name||'este integrante'}?`)){s.members=s.members.filter(x=>x.id!==id);Object.keys(s.support).forEach(k=>{if(k===id||s.support[k]?.primary===id||s.support[k]?.backup===id)delete s.support[k]});Object.keys(s.separated).forEach(k=>{if(k===id)delete s.separated[k]});['coord','comm','kit','utilities','pets'].forEach(k=>{if(s.roles[k]===id)s.roles[k]=''});save();render()}}
function openPet(){modal('Agregar mascota',`<form id="pf"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Tipo</label><select name="type"><option>Perro</option><option>Gato</option><option>Ave</option><option>Otro</option></select></div><div class="sticky"><button type="button" class="btn ghost" id="cancelP">Cancelar</button><button class="btn primary">Guardar mascota</button></div></form>`);$('#cancelP').onclick=close;$('#pf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);s.pets.push({id:uid(),name:f.get('name').trim(),type:f.get('type')});if(s.roles.pets==='NA')s.roles.pets='';save();close();render()}}
function chipsGroup(arr,selected,prefix){return arr.map(([id,n])=>`<div class="chip"><input type="checkbox" id="${prefix}_${id}" value="${id}" ${selected.includes(id)?'checked':''}><label for="${prefix}_${id}">${esc(n)}</label></div>`).join('')}
function openRisks(){modal('2. Amenazas y capacidades',`<form id="rf"><div class="field"><label>Amenazas pertinentes</label><div class="chips" id="ths">${chipsGroup(THREATS,s.threats,'th')}</div></div><div class="field"><label>Capacidades disponibles</label><div class="chips" id="cps">${chipsGroup(CAPS,s.caps,'cp')}</div></div><div id="thActions"></div><div class="sticky"><button type="button" class="btn ghost" id="cancelR">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);const draw=()=>{const ids=$$('#ths input:checked').map(x=>x.value);$('#thActions').innerHTML=ids.length?`<hr class="sep"><div class="context">Para cada amenaza selecciona una respuesta general. Es una guía familiar; las instrucciones oficiales prevalecen.</div>${ids.map(id=>`<div class="subcard" style="margin-bottom:8px"><h4>${esc(label(THREATS,id))}</h4><select name="tp_${id}"><option value="">Seleccionar respuesta</option>${THREAT_ACTIONS.map(([v,n])=>`<option value="${v}" ${s.threatPlans[id]===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}`:'<div class="na">Selecciona al menos una amenaza.</div>'};draw();$$('#ths input').forEach(x=>x.onchange=draw);$('#cancelR').onclick=close;$('#rf').onsubmit=e=>{e.preventDefault();s.threats=$$('#ths input:checked').map(x=>x.value);s.caps=$$('#cps input:checked').map(x=>x.value);const f=new FormData(e.currentTarget),np={};s.threats.forEach(id=>{const v=f.get(`tp_${id}`);if(v)np[id]=v});s.threatPlans=np;save();close();render()}}
function openReunion(){if(!humans().length){toast('Primero agrega integrantes');view='family';render();return}modal('3. Reunificación familiar',`<form id="reuf"><div class="context">Los integrantes ya registrados aparecen aquí automáticamente. No vuelvas a escribir sus nombres.</div><div class="field"><label>Zona exterior segura</label><input name="outsideZone" value="${esc(s.reunion.outsideZone)}" placeholder="Ej. área abierta acordada"></div><div class="field"><label>Zona interior</label><select name="insideMode"><option value="yes" ${!s.reunion.insideNA?'selected':''}>Sí aplica</option><option value="na" ${s.reunion.insideNA?'selected':''}>No aplica a nuestra planificación</option></select></div><div class="field"><label>Zona interior (si aplica)</label><input name="insideZone" value="${esc(s.reunion.insideZone)}"></div><div class="row"><div class="field"><label>Punto A · principal</label><input name="pointA" value="${esc(s.reunion.pointA)}" required></div><div class="field"><label>Punto B</label><select name="pointBMode"><option value="yes" ${!s.reunion.pointBNA?'selected':''}>Definir alternativo</option><option value="na" ${s.reunion.pointBNA?'selected':''}>No aplica</option></select><input style="margin-top:7px" name="pointB" value="${esc(s.reunion.pointB)}" placeholder="Punto alternativo"></div></div><hr class="sep"><div class="title"><div><h3>Si estamos separados</h3><p>Elige un acuerdo para cada integrante.</p></div></div>${humans().map(m=>`<div class="subcard" style="margin-bottom:8px"><h4>${esc(m.name)} · ${esc(m.place)}</h4><select name="sep_${m.id}"><option value="">Seleccionar acuerdo</option>${SEP_ACTIONS.map(([v,n])=>`<option value="${v}" ${s.separated[m.id]?.mode===v?'selected':''}>${n}</option>`).join('')}</select><input style="margin-top:7px" name="sepOther_${m.id}" value="${esc(s.separated[m.id]?.other||'')}" placeholder="Solo si eliges Otro"></div>`).join('')}<div class="sticky"><button type="button" class="btn ghost" id="cancelReu">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancelReu').onclick=close;$('#reuf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);s.reunion.outsideZone=f.get('outsideZone').trim();s.reunion.insideNA=f.get('insideMode')==='na';s.reunion.insideZone=s.reunion.insideNA?'':f.get('insideZone').trim();s.reunion.pointA=f.get('pointA').trim();s.reunion.pointBNA=f.get('pointBMode')==='na';s.reunion.pointB=s.reunion.pointBNA?'':f.get('pointB').trim();humans().forEach(m=>s.separated[m.id]={mode:f.get(`sep_${m.id}`),other:f.get(`sepOther_${m.id}`).trim()});save();close();render()}}
function openRoles(){if(!humans().length){toast('Primero agrega integrantes');return act('family')}const needPeople=humans().filter(m=>(m.needs||[]).length);modal('4. Apoyos y roles',`<form id="rolesf"><div class="context">Los responsables se eligen de la lista de integrantes. Si eliminas una persona, la aplicación revisa las asignaciones.</div><div class="row"><div class="field"><label>Coordinación general</label><select name="coord">${personOptions(s.roles.coord)}</select></div><div class="field"><label>Responsable de comunicación</label><select name="comm">${personOptions(s.roles.comm)}</select></div></div><div class="row"><div class="field"><label>Responsable del kit</label><select name="kit">${personOptions(s.roles.kit)}</select></div><div class="field"><label>Servicios de la vivienda</label><select name="utilities">${personOptions(s.roles.utilities,true)}</select></div></div>${hasPets()?`<div class="field"><label>Responsable de mascotas</label><select name="pets">${personOptions(s.roles.pets)}</select></div>`:'<div class="na">Mascotas: No aplica automáticamente porque no hay mascotas registradas.</div>'}<hr class="sep"><div class="title"><div><h3>Apoyos individuales</h3><p>Solo aparecen personas con necesidades registradas.</p></div></div>${needPeople.length?needPeople.map(m=>`<div class="subcard" style="margin-bottom:8px"><h4>${esc(m.name)}</h4><p style="font-size:.78rem;color:var(--muted)">${(m.needs||[]).map(n=>esc(label(NEEDS,n))).join(' · ')}</p><div class="field"><label>Modalidad de apoyo</label><select name="mode_${m.id}"><option value="">Seleccionar</option><option value="self" ${s.support[m.id]?.mode==='self'?'selected':''}>Autónomo/a · no requiere persona asignada</option><option value="assigned" ${s.support[m.id]?.mode==='assigned'?'selected':''}>Requiere persona de apoyo</option></select></div><div class="row"><div class="field"><label>Responsable principal</label><select name="primary_${m.id}">${personOptions(s.support[m.id]?.primary||'',false,m.id)}</select></div><div class="field"><label>Suplente</label><select name="backup_${m.id}">${personOptions(s.support[m.id]?.backup||'',true,m.id)}</select></div></div></div>`).join(''):'<div class="na">Apoyos individuales: No aplica. No se registraron necesidades especiales.</div>'}<div class="sticky"><button type="button" class="btn ghost" id="cancelRoles">Cancelar</button><button class="btn primary">Guardar roles</button></div></form>`);$('#cancelRoles').onclick=close;$('#rolesf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);s.roles.coord=f.get('coord');s.roles.comm=f.get('comm');s.roles.kit=f.get('kit');s.roles.utilities=f.get('utilities');s.roles.pets=hasPets()?f.get('pets'):'NA';needPeople.forEach(m=>{const mode=f.get(`mode_${m.id}`);s.support[m.id]={mode,primary:mode==='self'?'NA':f.get(`primary_${m.id}`),backup:mode==='self'?'NA':f.get(`backup_${m.id}`)}});save();close();render()}}
function openCommunication(){modal('5. Comunicación',`<form id="comf"><div class="row"><div class="field"><label>Medio principal</label><select name="primary"><option value="">Seleccionar</option>${METHODS.map(x=>`<option ${s.communication.primary===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Medio alternativo</label><select name="alt"><option value="NA" ${s.communication.alt==='NA'?'selected':''}>No aplica / no disponible</option>${METHODS.map(x=>`<option ${s.communication.alt===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="context">El contacto fuera de la zona puede ser alguien que no forme parte del hogar, por eso aquí sí se escribe.</div><div class="row"><div class="field"><label>Contacto fuera de la zona</label><input name="externalName" value="${esc(s.communication.externalName)}" required></div><div class="field"><label>Teléfono</label><input name="externalPhone" inputmode="tel" value="${esc(s.communication.externalPhone)}" required></div></div><div class="field"><label>Si no hay comunicación</label><select name="noComm"><option value="">Seleccionar acuerdo</option>${NORULES.map(x=>`<option ${s.communication.noComm===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Otro acuerdo (solo si aplica)</label><input name="noCommOther" value="${esc(s.communication.noCommOther)}"></div><div class="sticky"><button type="button" class="btn ghost" id="cancelCom">Cancelar</button><button class="btn primary">Guardar comunicación</button></div></form>`);$('#cancelCom').onclick=close;$('#comf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);['primary','alt','externalName','externalPhone','noComm','noCommOther'].forEach(k=>s.communication[k]=String(f.get(k)||'').trim());save();close();render()}}
function openBag(){const items=requiredBag(),bs=bagStats();modal('6. Kit familiar',`<form id="bagf"><div class="context">El kit se adapta automáticamente. Medicamentos, ayudas de movilidad, oxígeno, mascotas u otros elementos solo aparecen si aplican a tu familia.</div><div class="progress"><i style="width:${bs.pct}%"></i></div><p style="font-size:.8rem;color:var(--muted)">${bs.ready}/${bs.required} listos · ${bs.partial} parciales</p><div class="list">${items.map(([id,n])=>{const it=s.bag[id]||{status:'pending',qty:''};return`<div class="subcard"><div class="row"><div><strong>${esc(n)}</strong><p style="font-size:.76rem;color:var(--muted)">${CORE_BAG.some(x=>x[0]===id)?'Base familiar':'Agregado automáticamente por el contexto familiar'}</p></div><div><select name="st_${id}"><option value="pending" ${it.status==='pending'?'selected':''}>Pendiente</option><option value="partial" ${it.status==='partial'?'selected':''}>Parcial</option><option value="ready" ${it.status==='ready'?'selected':''}>Listo</option></select><input style="margin-top:6px" name="q_${id}" value="${esc(it.qty||'')}" placeholder="Cantidad / nota"></div></div></div>`}).join('')}</div><div class="sticky"><button type="button" class="btn ghost" id="cancelBag">Cancelar</button><button class="btn primary">Guardar kit</button></div></form>`);$('#cancelBag').onclick=close;$('#bagf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);items.forEach(([id])=>s.bag[id]={status:f.get(`st_${id}`),qty:String(f.get(`q_${id}`)||'').trim()});save();close();render()}}
function openDrill(scenario){modal('Registrar práctica',`<form id="drf"><div class="context"><strong>${esc(scenario)}</strong><br>Evalúa si el plan funcionó y qué debe cambiar.</div><div class="field"><label>Resultado</label><select name="result"><option>Satisfactorio</option><option>Parcialmente satisfactorio</option><option>Necesita mejora</option></select></div><div class="field"><label>Principal aprendizaje</label><select name="learning"><option>El punto de encuentro funcionó</option><option>La comunicación funcionó</option><option>La ruta necesita ajustes</option><option>Los roles necesitan ajustes</option><option>El kit necesita ajustes</option><option>Otro</option></select></div><div class="field"><label>Acción de mejora (opcional)</label><input name="improvement" placeholder="Solo si hay algo particular que corregir"></div><div class="sticky"><button type="button" class="btn ghost" id="cancelDr">Cancelar</button><button class="btn primary">Guardar práctica</button></div></form>`);$('#cancelDr').onclick=close;$('#drf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);s.drills.push({id:uid(),date:new Date().toISOString(),scenario,result:f.get('result'),learning:f.get('learning'),improvement:f.get('improvement').trim()});save();close();render()}}
function emergency(){const rows=humans().map(m=>{const a=s.separated[m.id],txt=a?.mode?label(SEP_ACTIONS,a.mode)+(a.other?': '+a.other:''):'Pendiente';return`<div class="subcard"><h4>${esc(m.name)} · ${esc(m.place)}</h4><p>${esc(txt)}</p></div>`}).join('');modal('Modo rápido · familia separada',`<div class="alert red"><strong>Ejecuta lo acordado.</strong> Las instrucciones oficiales y del lugar prevalecen.</div><div class="list" style="margin-top:10px">${rows||'<div class="na">No hay integrantes registrados.</div>'}</div><div class="section subcard"><h4>Punto A</h4><p>${esc(s.reunion.pointA||'Pendiente')}</p></div><div class="subcard"><h4>Punto B</h4><p>${esc(s.reunion.pointBNA?'No aplica':s.reunion.pointB||'Pendiente')}</p></div><div class="subcard"><h4>Sin comunicación</h4><p>${esc(s.communication.noComm||'Pendiente')}</p></div>`)}
function share(){const p=progress(),txt=`Plan Familiar de Emergencia${s.family?' · Familia '+s.family:''}\nCompletado: ${p.pct}%\nPunto A: ${s.reunion.pointA||'pendiente'}\nPunto B: ${s.reunion.pointBNA?'No aplica':s.reunion.pointB||'pendiente'}\nRegla sin comunicación: ${s.communication.noComm||'pendiente'}\nLa Movida SST Plus · www.movidasst.com`;if(navigator.share)navigator.share({title:'Plan Familiar de Emergencia',text:txt}).catch(()=>{});else navigator.clipboard?.writeText(txt).then(()=>toast('Resumen copiado'))}
function exportPlan(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='plan-familiar-emergencia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importer').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{s=migrate(JSON.parse(r.result));save('Respaldo importado');render()}catch{alert('Archivo no válido')}};r.readAsText(f);e.target.value=''}
function printPlan(){const b=bagStats();$('#print').innerHTML=`<h1>Plan Familiar de Emergencia</h1><p><strong>Familia:</strong> ${esc(s.family||'Sin identificar')} · <strong>Localidad:</strong> ${esc(s.city||'')}</p><h2>Integrantes</h2><table><tr><th>Nombre</th><th>Relación</th><th>Lugar</th><th>Necesidades</th></tr>${humans().map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.relation)}</td><td>${esc(m.place)}</td><td>${esc((m.needs||[]).map(n=>label(NEEDS,n)).join(', ')||'No aplica')}</td></tr>`).join('')}</table><h2>Amenazas</h2><p>${esc(s.threats.map(t=>label(THREATS,t)).join(' · ')||'Pendiente')}</p><h2>Reunificación</h2><p><strong>Zona exterior:</strong> ${esc(s.reunion.outsideZone||'Pendiente')}<br><strong>Punto A:</strong> ${esc(s.reunion.pointA||'Pendiente')}<br><strong>Punto B:</strong> ${esc(s.reunion.pointBNA?'No aplica':s.reunion.pointB||'Pendiente')}</p><h2>Roles</h2><p>Coordinación: ${esc(personName(s.roles.coord))} · Comunicación: ${esc(personName(s.roles.comm))} · Kit: ${esc(personName(s.roles.kit))} · Mascotas: ${esc(hasPets()?personName(s.roles.pets):'No aplica')}</p><h2>Comunicación</h2><p>Principal: ${esc(s.communication.primary||'Pendiente')} · Alternativo: ${esc(s.communication.alt||'Pendiente')}<br>Contacto externo: ${esc(s.communication.externalName||'Pendiente')} ${esc(s.communication.externalPhone||'')}<br>Sin comunicación: ${esc(s.communication.noComm||'Pendiente')}</p><h2>Kit</h2><p>${b.ready}/${b.required} elementos requeridos listos.</p><h2>Revisión</h2><ul>${rules().map(r=>`<li><strong>${esc(r[1])}:</strong> ${esc(r[2])}</li>`).join('')}</ul><p style="font-size:9px;color:#64748b">La Movida SST Plus · De la Reacción a la Prevención · www.movidasst.com</p>`;window.print()}
render();
})();
</script>
