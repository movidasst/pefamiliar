dding:8px 11px;font-size:.82rem}.section{margin-top:18px}.title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:10px}.title h2,.title h3{margin:0;color:var(--navy)}.title h2{font-size:1.18rem}.title h3{font-size:1rem}.title p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}.grid{display:grid;gap:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.metric strong{display:block;color:var(--navy);font-size:1.12rem}.metric span{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}.next{background:linear-gradient(135deg,#f0fbfb,#fff);border:1px solid #b9dde0;border-radius:22px;padding:16px}.next b{display:block;color:var(--navy);font-size:1.08rem}.next span{font-size:.77rem;color:var(--td);font-weight:800}.progress{height:10px;background:#e7eef1;border-radius:99px;overflow:hidden;margin:10px 0 4px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:99px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item strong{color:var(--navy)}.item p{margin:4px 0 0;color:var(--muted);font-size:.8rem;line-height:1.42}.tag{display:inline-flex;padding:4px 7px;border-radius:99px;background:#eef7f7;color:var(--td);font-size:.72rem;font-weight:800;margin:6px 4px 0 0}.bad{background:#fee4e5;color:#8c1e26}.warn{background:#fff0c7;color:#704f00}.ok{background:#e8f4e1;color:#355f20}.step{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);background:#fff;border-radius:15px}.num{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:#edf2f4;color:#6b7d88;font-weight:900}.step.done .num{background:#e8f4e1;color:#355f20}.step.current{border-color:#8ec8cd;background:#f1fbfb}.step .copy{flex:1;min-width:0}.step .copy b{display:block;color:var(--navy);font-size:.86rem}.step .copy span{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}.nav{position:fixed;z-index:50;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 18px),680px);height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 45px rgba(15,23,42,.16);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}.nav button{border:0;background:transparent;color:#667986;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:800}.nav button.active{background:#edf8f8;color:var(--td)}.nav .ico{font-size:1rem}.empty{text-align:center;padding:22px;border:1px dashed #cbd8de;border-radius:18px;color:var(--muted);font-size:.84rem}.alert{padding:12px 13px;border-radius:16px;border:1px solid #f2d982;background:#fff9e8;color:#684f00;font-size:.82rem;line-height:1.45}.alert.red{border-color:#fecaca;background:#fff2f2;color:#8f2525}.alert.info{border-color:#c8eaec;background:#effafa;color:#075a63}.field{margin-bottom:13px}.field label{display:block;font-size:.82rem;font-weight:800;color:#38506b;margin-bottom:5px}.field small{display:block;color:var(--muted);font-size:.74rem;margin:-1px 0 6px}.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid #cbd9e0;border-radius:13px;padding:11px 12px;background:#fff;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.row{display:grid;gap:10px}.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.chip input{position:absolute;opacity:0}.chip label{display:flex;align-items:center;min-height:48px;padding:9px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:.8rem;font-weight:700}.chip input:checked+label{border-color:var(--teal);background:#edfafa;color:var(--td)}dialog{width:min(680px,calc(100% - 20px));max-height:88vh;border:0;border-radius:25px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(2,17,35,.56);backdrop-filter:blur(4px)}.dlg{padding:18px;overflow:auto;max-height:88vh}.dlghead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.dlghead h2{margin:0;color:var(--navy);font-size:1.15rem}.x{border:0;background:#f1f5f7;width:42px;height:42px;border-radius:12px;color:var(--navy);font-weight:900}.sticky{position:sticky;bottom:-18px;margin:16px -18px -18px;padding:10px 18px 18px;background:linear-gradient(transparent,#fff 18%,#fff);display:flex;gap:8px}.sticky .btn{flex:1}.foot{text-align:center;color:#7b8993;font-size:.74rem;line-height:1.45;margin:24px auto 0}.print{display:none}@media(min-width:700px){.shell{padding-left:22px;padding-right:22px}.hero{padding:28px}.metrics{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:1fr 1fr}.chips{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.top,.shell,.nav,dialog{display:none!important}.print{display:block!important;padding:12mm;font-family:Arial,sans-serif;color:#222}.print h1{color:#00205b}.print h2{color:#007b85;font-size:16px;border-bottom:1px solid #ddd;padding-bottom:4px}.print p,.print li,.print td,.print th{font-size:10px;line-height:1.4}.print table{width:100%;border-collapse:collapse}.print td,.print th{border:1px solid #ddd;padding:5px;text-align:left}}

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2),esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const KEY='pefamiliar_directo_v1';
const TH=[['sismo','Sismo'],['incendio','Incendio'],['inundacion','Inundación'],['deslizamiento','Deslizamiento'],['servicios','Interrupción de servicios'],['tecnologica','Emergencia tecnológica'],['meteorologica','Evento meteorológico'],['otra','Otra']];
const VU=[['altura','Vivienda en altura'],['movilidad','Persona que requiere apoyo'],['ninos','Niños pequeños'],['mayores','Adultos mayores'],['mascotas','Mascotas'],['salida','Una sola salida'],['meds','Dependencia de medicamentos'],['separados','Familia separada gran parte del día'],['com','Sin alternativa de comunicación'],['otra','Otra']];
const CA=[['botiquin','Botiquín'],['extintor','Extintor'],['vehiculo','Medio de transporte'],['radio','Radio'],['linterna','Linterna'],['agua','Agua almacenada'],['pa','Primeros auxilios'],['vecinos','Vecinos organizados'],['familiar','Familiar cercano'],['comalt','Comunicación alternativa']];
const BAG=[['agua','Agua'],['alimentos','Alimentos'],['linterna','Linterna'],['radio','Radio'],['energia','Baterías / power bank'],['botiquin','Botiquín'],['documentos','Documentos'],['efectivo','Efectivo'],['llaves','Copias de llaves'],['medicamentos','Medicamentos'],['mascotas','Suministros de mascotas']];
const fresh=()=>({family:'',city:'',members:[],threats:[],vulns:[],caps:[],zones:{outside:'',a:'',b:'',notes:''},home:{main:'',alt:'',shelter:'',utilities:''},roles:{coord:'',comm:'',kit:''},communication:{primary:'',alt:'',externalName:'',externalPhone:'',rule:'',noResponse:''},bag:Object.fromEntries(BAG.map(([id])=>[id,{status:'pending',qty:''}])),drills:[],updated:new Date().toISOString()});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=fresh()}let view='home';
function save(msg='Guardado'){try{s.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(s));if(msg)toast(msg);return true}catch(e){alert('No se pudo guardar en este navegador. Exporta un respaldo antes de continuar.');return false}}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:90;background:#0f2f4e;color:#fff;padding:10px 14px;border-radius:13px;font-size:.82rem;box-shadow:0 12px 35px rgba(0,0,0,.2)';document.body.appendChild(e)}e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.remove(),1800)}
const humans=()=>s.members.filter(m=>m.kind!=='mascota');
const meds=()=>humans().some(m=>m.meds==='si'),pets=()=>s.members.some(m=>m.kind==='mascota')||s.vulns.includes('mascotas');
function requiredBag(){let a=['agua','alimentos','linterna','radio','energia','botiquin','documentos','efectivo','llaves'];if(meds())a.push('medicamentos');if(pets())a.push('mascotas');return a}
function ready(){const hs=humans(),r=[{k:'family',n:'Familia',d:'Integrantes y lugares habituales',ok:hs.length>0&&hs.every(m=>m.name&&m.place),a:'family'},{k:'risk',n:'Amenazas y contexto',d:'Amenazas, vulnerabilidades y capacidades',ok:s.threats.length>0&&s.vulns.length>0&&s.caps.length>0,a:'risk'},{k:'zones',n:'Encuentro y zonas',d:'Zona exterior y dos puntos de encuentro',ok:!!(s.zones.outside&&s.zones.a&&s.zones.b),a:'zones'},{k:'home',n:'Vivienda y evacuación',d:'Salida principal y alternativa',ok:!!(s.home.main&&s.home.alt),a:'homeform'},{k:'sep',n:'Si estamos separados',d:'Acción acordada para cada integrante',ok:hs.length>0&&hs.every(m=>(m.action||'').trim().length>=8),a:'separated'},{k:'comm',n:'Roles y comunicación',d:'Responsables, contacto externo y regla sin señal',ok:!!(s.roles.coord&&s.roles.comm&&s.communication.primary&&s.communication.externalName&&s.communication.externalPhone&&s.communication.rule),a:'comm'},{k:'bag',n:'Kit familiar',d:'Elementos requeridos listos',ok:requiredBag().every(id=>s.bag[id]?.status==='ready'),a:'bag'},{k:'drill',n:'Práctica y mejora',d:'Al menos un simulacro evaluado',ok:s.drills.length>0,a:'drill'}];return r}
function rules(){const o=[],hs=humans();if(!hs.length)o.push(['e','Familia no definida','Agrega al menos una persona.','family']);if(!s.threats.length)o.push(['e','Amenazas no identificadas','Selecciona las amenazas que corresponden a tu contexto.','risk']);if(!s.zones.a)o.push(['e','Punto A pendiente','Define un punto de encuentro inmediato.','zones']);if(!s.zones.b)o.push(['e','Punto B pendiente','Define un punto alternativo si el principal no es accesible.','zones']);if(!s.home.main)o.push(['e','Salida principal pendiente','Define la salida o ruta principal desde la vivienda.','homeform']);if(hs.length&&hs.some(m=>(m.action||'').trim().length<8))o.push(['e','Acuerdo cuando están separados incompleto','Cada integrante debe tener una acción previamente acordada.','separated']);hs.forEach(m=>{if(m.support&&!m.helper)o.push(['e',`Apoyo no asignado para ${m.name||'un integrante'}`,'Existe una necesidad de apoyo y falta responsable.','family'])});if(!s.communication.externalName||!s.communication.externalPhone)o.push(['e','Contacto fuera de la zona pendiente','Define una persona de enlace fuera de la zona local.','comm']);if(!s.communication.rule)o.push(['e','Regla sin comunicación pendiente','Acuerden qué hará cada persona si llamadas y datos fallan.','comm']);if(meds()&&s.bag.medicamentos?.status!=='ready')o.push(['e','Medicamentos pendientes','Hay dependencia de medicamentos y no están listos en el kit.','bag']);if(!requiredBag().every(id=>s.bag[id]?.status==='ready'))o.push(['i','Kit familiar incompleto','Los elementos requeridos deben estar realmente listos, no solo parciales.','bag']);if(!s.drills.length)o.push(['i','Plan sin practicar','Realiza un simulacro y registra una mejora.','drill']);if(s.threats.includes('incendio')&&!s.caps.includes('extintor'))o.push(['m','Revisar capacidad frente a incendio','Verifica si corresponde disponer y mantener un extintor en tu contexto.','risk']);return o}
function progress(){const a=ready(),done=a.filter(x=>x.ok).length;return{items:a,done,total:a.length,pct:Math.round(done/a.length*100)}}
function next(){return ready().find(x=>!x.ok)||ready().at(-1)}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const root=$('#view');root.innerHTML=view==='home'?home():view==='family'?family():view==='plan'?plan():view==='drill'?drill():more();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===view));bind()}
function home(){const p=progress(),n=next(),rs=rules(),started=humans().length||s.family||p.done;const e=rs.filter(x=>x[0]==='e').length;return`<section class="hero"><span class="eyebrow">Plan Familiar de Emergencia</span><h1>${s.family?`Familia ${esc(s.family)}`:'Construye decisiones que tu familia pueda ejecutar'}</h1><p>${started?'Continúa donde quedaste y resuelve primero lo esencial.':'Empieza por tu familia. La aplicación te guiará paso a paso sin depender de IA ni servicios externos.'}</p><div class="actions"><button class="btn yellow" data-act="continue">${started?'Continuar donde quedé':'Comenzar'} →</button><button class="btn ghost" data-act="emergency">Modo emergencia</button></div></section><section class="section next"><span>Tu siguiente paso · ${p.done}/${p.total}</span><b>${esc(n.n)}</b><p style="margin:5px 0 12px;color:var(--muted);font-size:.82rem">${esc(n.d)}</p><div class="progress"><i style="width:${p.pct}%"></i></div><div class="actions"><button class="btn primary small" data-act="${n.a}">Resolver ahora</button></div></section><section class="section"><div class="metrics"><div class="metric"><strong>${p.pct}%</strong><span>plan completado</span></div><div class="metric"><strong>${started?e:'—'}</strong><span>${started?'esenciales pendientes':'aún sin evaluar'}</span></div><div class="metric"><strong>${s.drills.length}</strong><span>simulacros</span></div><div class="metric"><strong>${humans().length}</strong><span>integrantes</span></div></div></section>${started?`<section class="section"><div class="title"><div><h2>Prioridad actual</h2><p>Recomendaciones basadas en reglas explícitas.</p></div><button class="btn soft small" data-go="plan">Ver todo</button></div>${rs.length?ruleHtml(rs[0]):'<div class="alert info">No hay pendientes detectados por las reglas configuradas.</div>'}</section>`:''}`}
function family(){return`<div class="title"><div><h2>Mi familia</h2><p>Registra integrantes, apoyos y lugares habituales.</p></div></div><section class="card"><div class="row"><div class="field"><label>Nombre o apellido de la familia</label><input id="fn" value="${esc(s.family)}" placeholder="Ej. Linares"></div><div class="field"><label>Ciudad / localidad</label><input id="fc" value="${esc(s.city)}" placeholder="Ej. Santiago"></div></div><button class="btn primary" data-act="savefamily">Guardar datos</button></section><section class="section"><div class="title"><div><h2>Integrantes</h2><p>Personas y mascotas.</p></div><button class="btn soft small" data-act="member">＋ Agregar</button></div><div class="list">${s.members.length?s.members.map(m=>`<article class="item"><div class="itemtop"><div><strong>${esc(m.name||'Sin nombre')}</strong><p>${esc(m.kind==='mascota'?'Mascota':m.role||'Integrante')} · ${esc(m.place||'Lugar pendiente')}</p>${m.support?'<span class="tag bad">Requiere apoyo</span>':''}${m.meds==='si'?'<span class="tag warn">Medicamentos</span>':''}</div><div><button class="btn soft small" data-member="${m.id}">Editar</button></div></div>${m.action?`<p><b>Si están separados:</b> ${esc(m.action)}</p>`:''}</article>`).join(''):'<div class="empty">Aún no has agregado integrantes.</div>'}</div></section>`}
function plan(){const p=progress(),n=next(),rs=rules();return`<div class="title"><div><h2>Mi plan</h2><p>Ocho componentes y una revisión automática separada.</p></div></div><section class="next"><span>Siguiente componente</span><b>${esc(n.n)}</b><p style="margin:5px 0 10px;color:var(--muted);font-size:.82rem">${esc(n.d)}</p><button class="btn primary small" data-act="${n.a}">Continuar</button></section><section class="section list">${p.items.map((x,i)=>`<div class="step ${x.ok?'done':''} ${x.k===n.k?'current':''}"><div class="num">${x.ok?'✓':i+1}</div><div class="copy"><b>${esc(x.n)}</b><span>${esc(x.d)}</span></div><button class="btn soft small" data-act="${x.a}">${x.ok?'Revisar':'Abrir'}</button></div>`).join('')}</section><section class="section"><div class="title"><div><h2>Revisión automática</h2><p>${rs.length} observación${rs.length===1?'':'es'} activa${rs.length===1?'':'s'}.</p></div><button class="btn soft small" data-act="print">PDF</button></div><div class="list">${rs.length?rs.map(ruleHtml).join(''):'<div class="alert info">Sin pendientes detectados. Mantén el plan actualizado y practícalo.</div>'}</div></section>`}
function ruleHtml(r){const c=r[0]==='e'?'bad':r[0]==='i'?'warn':'',t=r[0]==='e'?'Esencial':r[0]==='i'?'Importante':'Mejora';return`<article class="item"><div class="itemtop"><div><strong>${esc(r[1])}</strong><p>${esc(r[2])}</p></div><span class="tag ${c}">${t}</span></div><div class="actions"><button class="btn soft small" data-act="${r[3]}">Resolver ahora</button></div></article>`}
function drill(){const last=s.drills.at(-1);return`<div class="title"><div><h2>Practicar el plan</h2><p>Evalúa decisiones y mejoras, no la velocidad.</p></div><button class="btn primary small" data-act="newdrill">Nuevo simulacro</button></div><section class="card"><div class="alert info">El simulacro sirve para comprobar rutas, apoyo, comunicación y puntos de encuentro. El tiempo es solo un dato secundario.</div></section><section class="section"><div class="title"><div><h2>Historial</h2><p>${s.drills.length} práctica${s.drills.length===1?'':'s'} registrada${s.drills.length===1?'':'s'}.</p></div></div><div class="list">${s.drills.length?s.drills.slice().reverse().map(d=>`<article class="item"><strong>${esc(d.scenario)}</strong><p>${new Date(d.date).toLocaleString('es')} · evaluación ${d.score}%</p><p><b>Mejora:</b> ${esc(d.improve||'Sin nota')}</p></article>`).join(''):'<div class="empty">Todavía no hay simulacros evaluados.</div>'}</div></section>${last?`<section class="section alert info"><b>Última mejora:</b> ${esc(last.improve||'Sin nota')}</section>`:''}`}
function more(){return`<div class="title"><div><h2>Más herramientas</h2><p>Respaldo, impresión y privacidad.</p></div></div><section class="card"><div class="list"><div class="item"><strong>Generar plan imprimible / PDF</strong><p>Usa el diálogo de impresión del navegador y selecciona Guardar como PDF.</p><div class="actions"><button class="btn soft small" data-act="print">Generar</button></div></div><div class="item"><strong>Exportar respaldo</strong><p>Descarga una copia JSON con los datos de este dispositivo.</p><div class="actions"><button class="btn soft small" data-act="export">Exportar</button><button class="btn soft small" data-act="import">Importar</button></div></div><div class="item"><strong>Borrar plan local</strong><p>Elimina los datos guardados en este navegador.</p><div class="actions"><button class="btn danger small" data-act="reset">Borrar</button></div></div></div></section><section class="section alert info">Los datos se guardan únicamente en este navegador mediante almacenamiento local. No se envían a Gemini, Supabase ni a otras APIs.</section>`}
function open(title,html){$('#dt').textContent=title;$('#db').innerHTML=html;$('#dlg').showModal();$('#dlg').scrollTop=0}
function close(){$('#dlg').close()}
function chips(list,sel,p){return list.map(([id,n])=>`<div class="chip"><input id="${p}${id}" type="checkbox" value="${id}" ${sel.includes(id)?'checked':''}><label for="${p}${id}">${esc(n)}</label></div>`).join('')}
function selected(p){return $$(`input[id^="${p}"]:checked`,$('#db')).map(x=>x.value)}
function member(id=''){const m=s.members.find(x=>x.id===id)||{id:'',kind:'persona',name:'',role:'',place:'',support:'',helper:'',meds:'no',action:''};open(m.id?'Editar integrante':'Agregar integrante',`<form id="mf"><div class="row"><div class="field"><label>Nombre</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Tipo</label><select name="kind"><option value="persona" ${m.kind!=='mascota'?'selected':''}>Persona</option><option value="mascota" ${m.kind==='mascota'?'selected':''}>Mascota</option></select></div></div><div class="row"><div class="field"><label>Rol / relación</label><input name="role" value="${esc(m.role||'')}" placeholder="Madre, hijo, abuelo..."></div><div class="field"><label>Lugar habitual</label><input name="place" value="${esc(m.place||'')}" placeholder="Casa, trabajo, escuela..."></div></div><div class="field"><label>¿Qué apoyo necesita durante una emergencia?</label><textarea name="support">${esc(m.support||'')}</textarea></div><div class="field"><label>Responsable principal de apoyo</label><input name="helper" value="${esc(m.helper||'')}"></div><div class="field"><label>¿Depende de medicamentos?</label><select name="meds"><option value="no" ${m.meds!=='si'?'selected':''}>No</option><option value="si" ${m.meds==='si'?'selected':''}>Sí</option></select></div><div class="field"><label>Si están separados, ¿qué hará?</label><small>Dónde permanece, cuándo se desplaza y cómo aplica el acuerdo familiar.</small><textarea name="action">${esc(m.action||'')}</textarea></div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#mf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));if(m.id)Object.assign(m,d);else s.members.push({id:uid(),...d});if(save())close();render()}}
function risk(){open('Amenazas, vulnerabilidades y capacidades',`<form id="rf"><div class="field"><label>Amenazas pertinentes</label><div class="chips">${chips(TH,s.threats,'th')}</div></div><div class="field"><label>Vulnerabilidades</label><div class="chips">${chips(VU,s.vulns,'vu')}</div></div><div class="field"><label>Capacidades actuales</label><div class="chips">${chips(CA,s.caps,'ca')}</div></div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#rf').onsubmit=e=>{e.preventDefault();s.threats=selected('th');s.vulns=selected('vu');s.caps=selected('ca');save();close();render()}}
function zones(){open('Zonas y puntos de encuentro',`<form id="zf"><div class="alert info">Una zona segura y un punto de encuentro no son lo mismo. Define referencias que todos reconozcan.</div><div class="field" style="margin-top:12px"><label>Zona segura exterior</label><input name="outside" value="${esc(s.zones.outside)}"></div><div class="field"><label>Punto A · inmediato</label><input name="a" value="${esc(s.zones.a)}"></div><div class="field"><label>Punto B · alternativo / fuera del sector</label><input name="b" value="${esc(s.zones.b)}"></div><div class="field"><label>Notas / referencias</label><textarea name="notes">${esc(s.zones.notes||'')}</textarea></div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#zf').onsubmit=e=>{e.preventDefault();s.zones=Object.fromEntries(new FormData(e.currentTarget));save();close();render()}}
function homeform(){open('Vivienda y evacuación',`<form id="hf"><div class="field"><label>Salida / ruta principal</label><input name="main" value="${esc(s.home.main)}" placeholder="Ej. puerta principal → escalera norte"></div><div class="field"><label>Salida / ruta alternativa</label><input name="alt" value="${esc(s.home.alt)}"></div><div class="field"><label>Si no corresponde evacuar, ¿dónde permanecerán y bajo qué condición?</label><textarea name="shelter">${esc(s.home.shelter||'')}</textarea></div><div class="field"><label>Servicios de la vivienda</label><textarea name="utilities" placeholder="Quién sabe ubicar gas, electricidad u otros servicios.">${esc(s.home.utilities||'')}</textarea></div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#hf').onsubmit=e=>{e.preventDefault();s.home=Object.fromEntries(new FormData(e.currentTarget));save();close();render()}}
function separated(){if(!humans().length){toast('Primero agrega integrantes');go('family');return}open('Si estamos separados',`<form id="sf"><div class="alert">Supón que la emergencia ocurre durante una jornada normal y las llamadas no funcionan.</div>${humans().map(m=>`<div class="field" style="margin-top:12px"><label>${esc(m.name)} · ${esc(m.place||'lugar pendiente')}</label><textarea name="m_${m.id}" placeholder="Dónde permanece, quién puede apoyarlo y cuándo se desplaza.">${esc(m.action||'')}</textarea></div>`).join('')}<div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#sf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);humans().forEach(m=>m.action=String(f.get('m_'+m.id)||'').trim());save();close();render()}}
function comm(){open('Roles y comunicación',`<form id="cf"><div class="row"><div class="field"><label>Coordinación general</label><input name="coord" value="${esc(s.roles.coord)}"></div><div class="field"><label>Responsable de comunicación</label><input name="comm" value="${esc(s.roles.comm)}"></div></div><div class="field"><label>Responsable del kit</label><input name="kit" value="${esc(s.roles.kit||'')}"></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="row"><div class="field"><label>Medio principal</label><input name="primary" value="${esc(s.communication.primary)}" placeholder="Llamada, SMS, mensajería..."></div><div class="field"><label>Medio alternativo</label><input name="alt" value="${esc(s.communication.alt||'')}"></div></div><div class="row"><div class="field"><label>Contacto fuera de la zona</label><input name="externalName" value="${esc(s.communication.externalName)}" placeholder="Nombre"></div><div class="field"><label>Teléfono</label><input name="externalPhone" value="${esc(s.communication.externalPhone)}" inputmode="tel"></div></div><div class="field"><label>Regla si no hay comunicación</label><textarea name="rule">${esc(s.communication.rule)}</textarea></div><div class="field"><label>Si el contacto tampoco responde</label><textarea name="noResponse">${esc(s.communication.noResponse||'')}</textarea></div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#cf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));s.roles={coord:d.coord,comm:d.comm,kit:d.kit};s.communication={primary:d.primary,alt:d.alt,externalName:d.externalName,externalPhone:d.externalPhone,rule:d.rule,noResponse:d.noResponse};save();close();render()}}
function bag(){const req=requiredBag();open('Kit familiar',`<form id="bf"><div class="alert info">Un elemento solo se considera completo cuando está marcado como <b>Listo</b>. “Parcial” no completa el componente.</div><div class="list" style="margin-top:12px">${BAG.map(([id,n])=>{const x=s.bag[id]||{status:'pending',qty:''};return`<div class="item"><strong>${esc(n)} ${req.includes(id)?'<span class="tag bad">Requerido</span>':''}</strong><div class="row" style="margin-top:8px"><div class="field" style="margin:0"><label>Estado</label><select name="st_${id}"><option value="pending" ${x.status==='pending'?'selected':''}>Pendiente</option><option value="partial" ${x.status==='partial'?'selected':''}>Parcial</option><option value="ready" ${x.status==='ready'?'selected':''}>Listo</option></select></div><div class="field" style="margin:0"><label>Cantidad / nota</label><input name="q_${id}" value="${esc(x.qty||'')}"></div></div></div>`}).join('')}</div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=close;$('#bf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);BAG.forEach(([id])=>s.bag[id]={status:String(f.get('st_'+id)||'pending'),qty:String(f.get('q_'+id)||'')});save();close();render()}}
function newdrill(){open('Evaluar simulacro',`<form id="df"><div class="field"><label>Escenario</label><select name="scenario"><option>Sismo · familia separada</option><option>Incendio nocturno</option><option>Evacuación del sector</option><option>Corte prolongado de servicios</option><option>Personalizado</option></select></div>${['Todos reconocieron la señal','Cada persona aplicó la acción acordada','La ruta prevista fue utilizable','Se brindó el apoyo previsto','Funcionó el punto de encuentro','La comunicación fue viable'].map((q,i)=>`<div class="field"><label>${q}</label><select name="q${i}"><option value="1">Sí</option><option value=".5">Parcialmente</option><option value="0">No</option></select></div>`).join('')}<div class="field"><label>¿Qué debe corregirse?</label><textarea name="improve"></textarea></div><div class="sticky"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn primary">Registrar</button></div></form>`);$('#cancel').onclick=close;$('#df').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),vals=[0,1,2,3,4,5].map(i=>+f.get('q'+i));s.drills.push({id:uid(),date:new Date().toISOString(),scenario:String(f.get('scenario')),score:Math.round(vals.reduce((a,b)=>a+b,0)/6*100),improve:String(f.get('improve')||'')});save();close();render()}}
function emergency(){open('Modo emergencia · estamos separados',`<div class="alert red"><b>Ejecuta lo previamente acordado.</b><br>Las instrucciones de autoridades y responsables del lugar prevalecen.</div><div class="list" style="margin-top:12px">${humans().map(m=>`<div class="item"><strong>${esc(m.name)} · ${esc(m.place||'lugar pendiente')}</strong><p style="font-size:.92rem;color:var(--text)">${esc(m.action||'ACCIÓN NO DEFINIDA')}</p></div>`).join('')||'<div class="item">No hay integrantes registrados.</div>'}<div class="item"><strong>Punto A</strong><p>${esc(s.zones.a||'No definido')}</p></div><div class="item"><strong>Punto B</strong><p>${esc(s.zones.b||'No definido')}</p></div><div class="item"><strong>Contacto fuera de la zona</strong><p>${esc(s.communication.externalName||'No definido')} ${esc(s.communication.externalPhone||'')}</p></div><div class="item"><strong>Regla sin comunicación</strong><p>${esc(s.communication.rule||'No definida')}</p></div></div>`)}
function share(){const t=`PLAN FAMILIAR DE EMERGENCIA${s.family?' · Familia '+s.family:''}\nPunto A: ${s.zones.a||'pendiente'}\nPunto B: ${s.zones.b||'pendiente'}\nRegla sin comunicación: ${s.communication.rule||'pendiente'}\n\nLa Movida SST Plus · www.movidasst.com`;if(navigator.share)navigator.share({title:'Plan Familiar de Emergencia',text:t}).catch(()=>{});else navigator.clipboard?.writeText(t).then(()=>toast('Resumen copiado'))}
function printPlan(){const p=progress(),rs=rules(),rows=humans().map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.place)}</td><td>${esc(m.action||'Pendiente')}</td></tr>`).join('');$('#print').innerHTML=`<h1>Plan Familiar de Emergencia</h1><p><b>La Movida SST Plus · De la Reacción a la Prevención</b></p><p>Familia: ${esc(s.family||'Sin identificar')} · Localidad: ${esc(s.city||'Sin registrar')} · Plan completado: ${p.pct}%</p><h2>Familia y reunificación</h2><table><tr><th>Integrante</th><th>Lugar habitual</th><th>Acción si están separados</th></tr>${rows||'<tr><td colspan="3">Sin integrantes.</td></tr>'}</table><h2>Amenazas, vulnerabilidades y capacidades</h2><p><b>Amenazas:</b> ${s.threats.map(id=>TH.find(x=>x[0]===id)?.[1]||id).join(' · ')||'Pendiente'}</p><p><b>Vulnerabilidades:</b> ${s.vulns.map(id=>VU.find(x=>x[0]===id)?.[1]||id).join(' · ')||'Pendiente'}</p><p><b>Capacidades:</b> ${s.caps.map(id=>CA.find(x=>x[0]===id)?.[1]||id).join(' · ')||'Pendiente'}</p><h2>Zonas y encuentros</h2><p>Zona exterior: ${esc(s.zones.outside||'Pendiente')}<br>Punto A: ${esc(s.zones.a||'Pendiente')}<br>Punto B: ${esc(s.zones.b||'Pendiente')}</p><h2>Vivienda</h2><p>Salida principal: ${esc(s.home.main||'Pendiente')}<br>Salida alternativa: ${esc(s.home.alt||'Pendiente')}</p><h2>Comunicación</h2><p>Contacto externo: ${esc(s.communication.externalName||'Pendiente')} ${esc(s.communication.externalPhone||'')}<br>Regla sin comunicación: ${esc(s.communication.rule||'Pendiente')}</p><h2>Revisión automática</h2><ul>${rs.map(r=>`<li><b>${esc(r[1])}:</b> ${esc(r[2])}</li>`).join('')||'<li>Sin pendientes detectados.</li>'}</ul><p style="font-size:9px;color:#666">La completitud documental no equivale a un nivel de seguridad. Las instrucciones oficiales prevalecen.</p>`;window.print()}
function exportData(){const b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='plan-familiar-emergencia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function bind(){$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$$('[data-member]').forEach(b=>b.onclick=()=>member(b.dataset.member))}
function act(a){if(a==='continue'){const n=next();a=n.a}if(a==='family')return go('family');if(a==='drill')return go('drill');if(a==='risk')return risk();if(a==='zones')return zones();if(a==='homeform')return homeform();if(a==='separated')return separated();if(a==='comm')return comm();if(a==='bag')return bag();if(a==='member')return member();if(a==='newdrill')return newdrill();if(a==='emergency')return emergency();if(a==='share')return share();if(a==='print')return printPlan();if(a==='savefamily'){s.family=$('#fn').value.trim();s.city=$('#fc').value.trim();save();return render()}if(a==='export')return exportData();if(a==='import')return $('#importer').click();if(a==='reset'&&confirm('¿Borrar el plan guardado en este navegador?')){localStorage.removeItem(KEY);s=fresh();save('Plan reiniciado');return go('home')}}
$('#dx').onclick=close;$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))close()});$('#importer').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object'||!Array.isArray(x.members))throw Error('Formato no válido');s={...fresh(),...x};save('Respaldo restaurado');render()}catch(err){alert('No se pudo importar: '+err.message)}};r.readAsText(f);e.target.value=''};$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-act="share"]').forEach(b=>b.onclick=share);render();
})();
</script>
</body>
</html>
