name: Actualizar logo oficial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-official-logo.yml'

permissions:
  contents: write

jobs:
  update-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar logo oficial autorizado
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/movidasst/geo/main/logo-oficial-movida-sst-plus.png \
            -o logo-oficial-movida-sst-plus.png

      - name: Verificar PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('logo-oficial-movida-sst-plus.png')
          data=p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'El archivo descargado no es PNG válido'
          assert len(data) > 100000, 'El logo descargado parece incompleto'
          print('Logo verificado:', len(data), 'bytes')
          PY

      - name: Actualizar referencias sin tocar la lógica de la aplicación
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          old='/logo-movida-sst-plus.png'
          new='/logo-oficial-movida-sst-plus.png'
          count=text.count(old)
          if count < 3:
              raise SystemExit(f'Se esperaban al menos 3 referencias al logo anterior y se encontraron {count}')
          text=text.replace(old,new)
          text=text.replace('"width": 600,\n        "height": 600','"width": 1254,\n        "height": 1254')
          index.write_text(text,encoding='utf-8')

          manifest=Path('site.webmanifest')
          m=manifest.read_text(encoding='utf-8')
          if old not in m:
              raise SystemExit('No se encontró el logo anterior en site.webmanifest')
          m=m.replace(old,new).replace('"sizes": "600x600"','"sizes": "1254x1254"')
          manifest.write_text(m,encoding='utf-8')
          print('Referencias actualizadas:', count)
          PY

      - name: Verificar cambios
        run: |
          set -euo pipefail
          grep -q '/logo-oficial-movida-sst-plus.png' index.html
          grep -q '/logo-oficial-movida-sst-plus.png' site.webmanifest
          test -s logo-oficial-movida-sst-plus.png
          git diff --check

      - name: Publicar actualización
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site.webmanifest logo-oficial-movida-sst-plus.png
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes.'
            exit 0
          fi
          git commit -m 'Actualiza logo oficial en Plan Familiar de Emergencia'
          git push
