name: assemble-pef
on:
  push:
    paths:
      - '.github/workflows/assemble-pef.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar actualización verificada
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' > /tmp/patch.b64
          printf '%s' '' >> /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/pef.patch.zst
          zstd -d --patch-from=index.html /tmp/pef.patch.zst -o /tmp/index.new
          test "$(git hash-object /tmp/index.new)" = "e0a292362a146c9544a88c6182cc506e86849bb0"
          mv /tmp/index.new index.html
          rm -f .github/workflows/assemble-pef.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar catálogos PEF y flujos visuales"
          git push
